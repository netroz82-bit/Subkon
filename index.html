<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Subkon</title>
<style>
:root{--b:#2b7fff;--l:#16264a;--m:#8aa0c8;--t:#e8f0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;color:var(--t);font-family:Tahoma,Vazirmatn,system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px}
h1{margin:0;font-size:24px;color:var(--b);font-weight:800}
.st{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--l);color:var(--m);display:flex;align-items:center;gap:6px}
.st i{width:8px;height:8px;border-radius:50%;background:#556}
.st.ok{color:#5be08a;border-color:#2ecc71}.st.ok i{background:#2ecc71;box-shadow:0 0 8px #2ecc71}
.st.bad{color:#ff7b8a;border-color:#6b1f2a}.st.bad i{background:#ff3b4f;box-shadow:0 0 8px #ff3b4f}
.sp{flex:1}
.menu{width:44px;height:44px;border:0;background:none;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px}
.menu b{height:3px;border-radius:2px;background:var(--b)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px;overflow:auto}
#add{width:min(68vw,280px);aspect-ratio:1;border-radius:40px;border:2px dashed var(--b);background:radial-gradient(circle at 50% 40%,#0d2250,#02050d);color:var(--b);font-size:130px;font-weight:200;display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px #2b7fff2e;padding:0 0 12px}
#add:active{transform:scale(.97)}
#work{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;align-self:flex-start;margin:auto}
.vw{position:relative;background:#050a18;border:1px solid var(--l);border-radius:16px;overflow:hidden}
video{width:100%;max-height:42vh;display:block;background:#000}
#cue{position:absolute;inset:auto 8px 46px;text-align:center;font-size:15px;font-weight:700;text-shadow:0 0 4px #000,0 0 4px #000;pointer-events:none}
#nm{font-size:13px;color:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--b),#0a4fd6)}
.btn.g{background:none;border:1px solid var(--b);color:var(--b)}
.btn:disabled,select:disabled{opacity:.35}
select,input{width:100%;border:1px solid var(--l);background:#050a18;color:var(--t);border-radius:12px;padding:13px;font:inherit;font-size:15px}
input{direction:ltr;letter-spacing:2px;text-align:left}
.bar{height:8px;background:#0b1630;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0a4fd6,#5cb3ff);transition:width .3s}
#msg{font-size:13px;color:var(--m);margin-top:6px;text-align:center}
.dl{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid var(--l)}
#set,#ed{position:fixed;inset:0;background:#000;z-index:9;overflow:auto;padding:env(safe-area-inset-top) 16px 16px;display:flex;flex-direction:column;gap:14px}
#set header,#ed header{padding:12px 0}
#set label{font-size:13px;color:var(--m);display:block;margin-bottom:6px}
#set>*,#ed>*{flex-shrink:0}
.opts{display:flex;gap:10px}.opts button{flex:1;height:46px;border-radius:12px;border:2px solid var(--l);background:#050a18;color:var(--t);font:inherit}.opts button.on{border-color:var(--b);background:#0d2250}#co button{border-radius:50%;flex:none;width:46px;border:3px solid #000}#co button.on{outline:3px solid var(--b)}
.cr{display:flex;flex-direction:column;gap:6px}.ct{font-size:12px;color:var(--m);direction:ltr;text-align:right}
textarea{width:100%;border:1px solid var(--l);background:#050a18;color:var(--t);border-radius:12px;padding:10px;font:inherit;font-size:15px;resize:none}
#el{display:flex;flex-direction:column;gap:12px}#ok{position:sticky;bottom:0;box-shadow:0 0 0 10px #000}
.x{border:0;background:none;color:var(--b);font-size:34px;width:44px;height:44px}
.pst{font-size:11px;margin-right:8px;color:var(--m)}.pst.ok{color:#5be08a}.pst.bad{color:#ff7b8a}
.hint{font-size:12px;color:var(--m);line-height:1.9;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>Subkon</h1>
  <div class="st" id="st"><i></i><span id="stt">…</span></div>
  <div class="sp"></div>
  <button class="menu" id="mn" aria-label="تنظیمات"><b></b><b></b><b></b></button>
</header>

<main>
  <div style="width:min(100%,520px)"><label style="font-size:13px;color:var(--m);display:block;margin-bottom:6px">زبان زیرنویس خروجی</label><select id="lg"></select></div>
  <button id="add" aria-label="افزودن ویدئو">+</button>
  <input type="file" id="f" accept="video/*" hidden>
  <section id="work" hidden>
    <div class="vw"><video id="pv" controls playsinline></video><div id="cue"></div></div>
    <div id="nm"></div>
    <div class="row"><button class="btn" id="go">شروع زیرنویس</button><button class="btn g" id="chg">ویدئوی دیگر</button></div>
    <div id="pg" hidden><div class="bar"><i id="bar"></i></div><div id="msg"></div></div>
    <div class="dl">
      <button class="btn" id="ds" disabled>مشاهده و دانلود زیرنویس</button>
      <select id="q">
        <option value="360">کیفیت ۳۶۰p</option>
        <option value="480">کیفیت ۴۸۰p</option>
        <option value="720" selected>کیفیت ۷۲۰p</option>
        <option value="1080">کیفیت ۱۰۸۰p</option>
        <option value="0">کیفیت اصلی</option>
      </select>
      <button class="btn g" id="dv" disabled>ساخت و دانلود ویدئوی زیرنویس‌دار</button>
    </div>
  </section>
</main>

<div id="set" hidden>
  <header><h1>تنظیمات</h1><div class="sp"></div><button class="x" id="cl" aria-label="بستن">×</button></header>
  <div><label>کلید API جمینای <span class="pst" id="s1"></span></label><input id="key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <div><label>کلید API گروک (Groq) <span class="pst" id="s2"></span></label><input id="gkey" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <button class="btn" id="save" style="flex:none">ثبت کلیدها</button>
  <div><label>موتور رونویسی</label><div class="opts" id="pm"><button data-v="auto">خودکار</button><button data-v="gemini">جمینای</button><button data-v="groq">گروک</button></div><div class="hint">در حالت خودکار، سریع‌ترین انتخاب می‌شود. در هر حالت اگر یکی قطع شود یا سهمیه‌اش تمام شود، برنامه خودکار به دیگری می‌رود.</div><div class="hint" id="ph"></div></div>
  <div><label>رنگ زیرنویس</label><div class="opts" id="co"><button data-v="#ff8a1f" style="background:#ff8a1f"></button><button data-v="#ffffff" style="background:#fff"></button><button data-v="#ffd60a" style="background:#ffd60a"></button><button data-v="#3fa0ff" style="background:#3fa0ff"></button></div></div>
  <div><label>اندازه زیرنویس</label><div class="opts" id="sg"><button data-v=".035">کوچک</button><button data-v=".05">متوسط</button><button data-v=".07">بزرگ</button></div></div>
  <canvas id="sp" width="640" height="360" style="width:100%;max-width:360px;align-self:center;border-radius:12px;border:1px solid var(--l)"></canvas>
</div>

<div id="ed" hidden>
  <header><h1>ویرایش زیرنویس</h1><div class="sp"></div><button class="x" id="ec" aria-label="بستن">×</button></header>
  <div id="el"></div>
  <button class="btn" id="ok">تایید و دانلود</button>
</div>

<script>
const $=s=>document.querySelector(s),B='https://generativelanguage.googleapis.com',sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LANGS=[['fa','فارسی','Persian'],['en','انگلیسی','English'],['ar','عربی','Arabic'],['tr','ترکی استانبولی','Turkish'],['az','آذربایجانی','Azerbaijani'],['ku','کردی','Kurdish'],['ur','اردو','Urdu'],['hi','هندی','Hindi'],['bn','بنگالی','Bengali'],['fr','فرانسوی','French'],['de','آلمانی','German'],['es','اسپانیایی','Spanish'],['it','ایتالیایی','Italian'],['pt','پرتغالی','Portuguese'],['ru','روسی','Russian'],['uk','اوکراینی','Ukrainian'],['pl','لهستانی','Polish'],['nl','هلندی','Dutch'],['sv','سوئدی','Swedish'],['cs','چکی','Czech'],['ro','رومانیایی','Romanian'],['hu','مجاری','Hungarian'],['el','یونانی','Greek'],['he','عبری','Hebrew'],['zh','چینی','Chinese'],['ja','ژاپنی','Japanese'],['ko','کره‌ای','Korean'],['th','تایلندی','Thai'],['vi','ویتنامی','Vietnamese'],['id','اندونزیایی','Indonesian']];
let key='',real='',lang='fa',file=null,url='',cues=[],srt='',busy=false,gkey='',greal='',mode='auto',SM={};
try{lang=localStorage.getItem('sl')||'fa';key=localStorage.getItem('sk')||'';gkey=localStorage.getItem('gk')||'';mode=localStorage.getItem('sv')||'auto';SM=JSON.parse(localStorage.getItem('sm')||'{}')}catch(e){}
real=key;greal=gkey;
$('#lg').innerHTML=LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join('');$('#lg').value=lang;
$('#lg').onchange=e=>{lang=e.target.value;try{localStorage.setItem('sl',lang)}catch(x){}};
let sc='#ffffff',sz='.05';
try{sc=localStorage.getItem('sc')||sc;sz=localStorage.getItem('sz')||sz}catch(e){}
function sty(){document.querySelectorAll('#co button,#sg button').forEach(b=>b.classList.toggle('on',b.dataset.v==(b.parentNode.id=='co'?sc:sz)));$('#cue').style.color=sc;$('#cue').style.fontSize=Math.round(sz*300)+'px';pvw()}
function pvw(){const x=$('#sp').getContext('2d'),v=$('#pv'),W=640,H=360,g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0a1a3a');g.addColorStop(1,'#1b4fb0');x.fillStyle=g;x.fillRect(0,0,W,H);
  if(file&&v.videoWidth){const r=Math.max(W/v.videoWidth,H/v.videoHeight),w=v.videoWidth*r,h=v.videoHeight*r;try{x.drawImage(v,(W-w)/2,(H-h)/2,w,h)}catch(e){}}
  cap(x,'نمونه زیرنویس',W,H,Math.round(H*sz),true)}
document.querySelectorAll('#co button,#sg button').forEach(b=>b.onclick=()=>{const c=b.parentNode.id=='co';if(c)sc=b.dataset.v;else sz=b.dataset.v;try{localStorage.setItem(c?'sc':'sz',c?sc:sz)}catch(e){}sty()});sty();
function mk(el,get,set){const m=()=>{el.value='*'.repeat(get().length)};m();el.oninput=()=>{const v=el.value,r=get();let i=0;while(i<v.length&&i<r.length&&v[i]=='*')i++;set(r.slice(0,i)+v.slice(i));m()}}
mk($('#key'),()=>real,v=>real=v);mk($('#gkey'),()=>greal,v=>greal=v);
function status(c,t){$('#st').className='st '+c;$('#stt').textContent=t}
const PN={gemini:'جمینای',groq:'گروک'},CN={},DW={},RT={},PR={gemini:.12,groq:.04};
const GB='https://api.groq.com/openai/v1',GSTT=['whisper-large-v3-turbo','whisper-large-v3'],GCHAT=['llama-3.3-70b-versatile','openai/gpt-oss-120b','openai/gpt-oss-20b','llama-3.1-8b-instant'],GM={stt:GSTT[0],chat:GCHAT[0]};
let used={},sw=0,LP='';
const E=(m,s)=>Object.assign(new Error(m),{st:s}),kf=p=>p=='groq'?gkey:key;
function pickG(l){const d=(l||[]).filter(m=>m.active!==false).map(m=>m.id),x=/guard|whisper|tts|orpheus|compound|safeguard/;
  GM.stt=GSTT.find(i=>d.includes(i))||d.find(i=>/whisper/.test(i)&&!/distil/.test(i))||GM.stt;
  GM.chat=GCHAT.find(i=>d.includes(i))||d.find(i=>/llama|gpt-oss|qwen/.test(i)&&!x.test(i))||GM.chat}
async function check(p){
  const k=kf(p),lb=$(p=='groq'?'#s2':'#s1'),pt=(c,t)=>{lb.className='pst '+c;lb.textContent=t};
  CN[p]=false;
  if(!k){pt('','ثبت نشده');return false}
  pt('','…');
  try{const t=performance.now(),r=await(p=='groq'?fetch(GB+'/models',{headers:{Authorization:'Bearer '+k}}):fetch(B+'/v1beta/models?pageSize=1&key='+encodeURIComponent(k)));
    if(r.ok){RT[p]=performance.now()-t;if(p=='groq')pickG((await r.json()).data);if(DW[p]>Date.now()+1e12)DW[p]=0;CN[p]=true;pt('ok','متصل');return true}
    pt('bad',[400,401,403].includes(r.status)?'کلید نامعتبر یا مسدود':'خطا '+r.status)}
  catch(e){pt('bad','عدم دسترسی به سرویس')}
  return false}
async function checkAll(){status('','در حال بررسی…');const r=await Promise.all([check('gemini'),check('groq')]);Object.values(CN).includes(true)?status('ok','متصل'):status('bad','قطع');return r[0]||r[1]}
const est=p=>SM[p]?SM[p].v:PR[p]+(RT[p]||0)/6e4,old=p=>!SM[p]||Date.now()-SM[p].t>1728e5,up=p=>kf(p)&&CN[p]!==false&&!(DW[p]>Date.now());
function spd(){const a=['groq','gemini'].filter(p=>SM[p]).map(p=>PN[p]+' ≈ '+Math.max(1,Math.round(1/SM[p].v))+'× سریع‌تر از پخش');$('#ph').textContent=a.length?'سرعت اندازه‌گیری‌شده: '+a.join(' · '):'سرعت هنوز اندازه‌گیری نشده؛ با اولین زیرنویس خودکار سنجیده می‌شود.'}
function learn(p,v){const o=SM[p];SM[p]={v:o?o.v*.6+v*.4:v,t:Date.now()};try{localStorage.setItem('sm',JSON.stringify(SM))}catch(e){}spd()}
function order(){const a=['gemini','groq'].filter(kf),u=a.filter(up).sort((x,y)=>est(x)-est(y));
  if(mode!='auto'&&u.includes(mode))u.unshift(...u.splice(u.indexOf(mode),1));
  return[...u,...a.filter(p=>!u.includes(p))]}
const fin=c=>({...c,e:Math.min(c.e,c.s+Math.max(3,1.5+c.t.length*.09))});
function spl(c){const L=72;if(c.t.length<=L&&c.e-c.s<=7)return[fin(c)];
  const p=[];let cur='';for(const x of c.t.split(/\s+/)){if(cur&&(cur+' '+x).length>L){p.push(cur);cur=x}else cur=cur?cur+' '+x:x}
  if(cur)p.push(cur);const tot=p.reduce((a,x)=>a+x.length,0),d=c.e-c.s;let t=c.s;
  return p.map(x=>{const e=t+d*x.length/tot,o={s:t,e,t:x};t=e;return fin(o)})}
async function grqTr(sg,n){
  const body={model:GM.chat,temperature:.2,messages:[{role:'system',content:`You are a professional subtitle translator. Translate every numbered line into ${n}. Keep each line short and natural. Reply ONLY with the same number of lines in the exact format: number|translation. Never merge, split, skip, add or explain.`},{role:'user',content:sg.map((c,i)=>(i+1)+'|'+c.t.replace(/[\r\n|]+/g,' ')).join('\n')}]};
  if(/gpt-oss/.test(GM.chat))body.reasoning_effort='low';
  const r=await fx(GB+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+gkey},body:JSON.stringify(body)});
  if(!r)throw E('زمان انتظار ترجمه به پایان رسید',0);
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw E(j.error?.message||r.status,r.status);
  const o={};(j.choices?.[0]?.message?.content||'').replace(/<think>[\s\S]*?<\/think>/g,'').split('\n').forEach(l=>{const m=l.match(/^\s*(\d+)\s*[|:：.\-]\s*(.+)$/);if(m)o[+m[1]]=m[2].trim()});
  let miss=0;const out=sg.map((c,i)=>{const t=o[i+1];if(!t){miss++;return c}return{...c,t}});
  if(miss>sg.length*.3)throw E('ترجمه ناقص بود',0);
  return out}
async function grqGen(blob,off){
  const n=LANGS.find(l=>l[0]==lang)[2];let r,j;
  for(let t=0;t<2;t++){
    const fd=new FormData();fd.append('file',blob,'a.wav');fd.append('model',GM.stt);fd.append('response_format','verbose_json');fd.append('temperature','0');
    r=await fx(GB+'/audio/transcriptions',{method:'POST',headers:{Authorization:'Bearer '+gkey},body:fd});
    if(!r)throw E('زمان انتظار یا قطع اتصال',0);
    j=await r.json().catch(()=>({}));
    if(r.ok)break;
    if((r.status==429||r.status==503)&&!t){await sleep(Math.min(8,+r.headers.get('retry-after')||4)*1e3);continue}

  const dl=String(j.language||'').toLowerCase();
  if(dl!=n.toLowerCase()&&dl!=lang)sg=await grqTr(sg,n);
  return sg.flatMap(spl)}
async function run(p,blob,off,dur,alt){const t0=Date.now();
  try{const r=await(p=='groq'?grqGen:gemGen)(blob,off,alt);learn(p,(Date.now()-t0)/1e3/dur);used[p]=(used[p]||0)+1;LP=p;return r}
  catch(e){DW[p]=Date.now()+(e.st==401||e.st==403||/api.?key/i.test(e.message)?1e13:e.st==429?6e4:2e4);throw e}}
async function proc(blob,off,dur,probe){
  const o=order(),l=o.filter(up),er=[];
  if(probe&&mode=='auto'&&l.length>1&&l.some(old))return new Promise((ok,no)=>{let n=l.length,dn=0;
    l.forEach(p=>run(p,blob,off,dur,true).then(r=>{if(!dn){dn=1;ok(r)}},e=>{er.push(PN[p]+': '+(e.message||e));if(!--n&&!dn)no(new Error(er.join(' | ')))}))});
  for(let i=0;i<o.length;i++){try{return await run(o[i],blob,off,dur,i<o.length-1)}catch(e){er.push(PN[o[i]]+': '+(e.message||e));if(i<o.length-1)sw++}}
  throw new Error(er.join(' | '))}
function pmUp(){document.querySelectorAll('#pm button').forEach(b=>b.classList.toggle('on',b.dataset.v==mode))}
document.querySelectorAll('#pm button').forEach(b=>b.onclick=()=>{mode=b.dataset.v;try{localStorage.setItem('sv',mode)}catch(e){}pmUp()});
$('#save').onclick=async()=>{key=real.trim();gkey=greal.trim();try{localStorage.setItem('sk',key);localStorage.setItem('gk',gkey)}catch(e){}for(const p in DW)DW[p]=0;if(await checkAll())$('#set').hidden=true};
$('#mn').onclick=()=>{$('#set').hidden=false;pvw();spd()};
$('#cl').onclick=()=>$('#set').hidden=true;

$('#add').onclick=()=>$('#f').click();
$('#chg').onclick=()=>{if(!busy)$('#f').click()};
$('#f').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!(f.type||'').startsWith('video/'))return;
  if(url)URL.revokeObjectURL(url);file=f;url=URL.createObjectURL(f);cues=[];srt='';
  $('#pv').src=url;$('#nm').textContent=f.name;$('#cue').textContent='';
  $('#add').hidden=true;$('#work').hidden=false;$('#pg').hidden=true;$('#dv').disabled=$('#ds').disabled=true};
$('#pv').ontimeupdate=e=>{const t=e.target.currentTime,q=cues.find(k=>t>=k.s&&t<k.e);$('#cue').textContent=q?q.t:''};

let T0=0,LT='';function show(){$('#msg').textContent=LT+(T0?' · '+Math.round((Date.now()-T0)/1000)+' ثانیه':'')}setInterval(show,1000);
function prog(p,t){$('#pg').hidden=false;$('#bar').style.width=p+'%';LT=t;show()}
const fx=(u,o)=>fetch(u,{...o,signal:AbortSignal.timeout?AbortSignal.timeout(45000):undefined}).catch(()=>null);
const MS=['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-flash-latest'];let mi=0;
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
function wav(p){const w=new DataView(new ArrayBuffer(44+p.length*2)),s=(o,t)=>[...t].forEach((c,i)=>w.setUint8(o+i,c.charCodeAt(0)));
