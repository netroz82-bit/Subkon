<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Subkon</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;color:var(--t);font-family:Tahoma,Vazirmatn,system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px}
h1{margin:0;font-size:24px;color:var(--b);font-weight:800}
.st{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--l);color:var(--m);display:flex;align-items:center;gap:6px}
.st i{width:8px;height:8px;border-radius:50%;background:#556}
.st.ok{color:#5be08a;border-color:#2ecc71}.st.ok i{background:#2ecc71;box-shadow:0 0 8px #2ecc71}
.st.bad{color:#ff7b8a;border-color:#6b1f2a}.st.bad i{background:#ff3b4f;box-shadow:0 0 8px #ff3b4f}
.sp{flex:1}
.menu{width:44px;height:44px;border:0;background:none;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px}
.menu b{height:3px;border-radius:2px;background:var(--b)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px;overflow:auto}
#add{width:min(68vw,280px);aspect-ratio:1;border-radius:40px;border:2px dashed var(--b);background:radial-gradient(circle at 50% 40%,#0d2250,#02050d);color:var(--b);font-size:130px;font-weight:200;display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px #2b7fff2e;padding:0 0 12px}
#add:active{transform:scale(.97)}
#work{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;align-self:flex-start;margin:auto}
.vw{position:relative;background:#050a18;border:1px solid var(--l);border-radius:16px;overflow:hidden}
video{width:100%;max-height:42vh;display:block;background:#000}
#cue{position:absolute;inset:auto 8px 46px;text-align:center;font-size:15px;font-weight:700;text-shadow:0 0 4px #000,0 0 4px #000;pointer-events:none}
#nm{font-size:13px;color:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--b),#0a4fd6)}
.btn.g{background:none;border:1px solid var(--b);color:var(--b)}
.btn:disabled,select:disabled{opacity:.35}
select,input{width:100%;border:1px solid var(--l);background:#050a18;color:var(--t);border-radius:12px;padding:13px;font:inherit;font-size:15px}
input{direction:ltr;letter-spacing:2px;text-align:left}
.bar{height:8px;background:#0b1630;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0a4fd6,#5cb3ff);transition:width .3s}
#msg{font-size:13px;color:var(--m);margin-top:6px;text-align:center}
.dl{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid var(--l)}

#set label{font-size:13px;color:var(--m);display:block;margin-bottom:6px}

</style>
</head>
<body>
<header>
  <h1>Subkon</h1>
  <div class="st" id="st"><i></i><span id="stt">…</span></div>
  <div class="sp"></div>
  <button class="menu" id="mn" aria-label="تنظیمات"><b></b><b></b><b></b></button>

<main>

  <section id="work" hidden>

    <div id="nm"></div>
    <div class="row"><button class="btn" id="go">شروع زیرنویس</button><button class="btn g" id="chg">ویدئوی دیگر</button></div>
    <div id="pg" hidden><div class="bar"><i id="bar"></i></div><div id="msg"></div></div>
    <div class="dl">
      <button class="btn" id="ds" disabled>مشاهده و دانلود زیرنویس</button>
      <select id="q">
        <option value="360">کیفیت ۳۶۰p</option>
        <option value="480">کیفیت ۴۸۰p</option>
        <option value="720" selected>کیفیت ۷۲۰p</option>
        <option value="1080">کیفیت ۱۰۸۰p</option>
        <option value="0">کیفیت اصلی</option>
      </select>
      <button class="btn g" id="dv" disabled>ساخت و دانلود ویدئوی زیرنویس‌دار</button>
    </div>
  </section>
</main>

<div id="set" hidden>
  <header><h1>تنظیمات</h1><div class="sp"></div><button class="x" id="cl" aria-label="بستن">×</button></header>
  <div><label>کلید API جمینای</label><input id="key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <button class="btn" id="save" style="flex:none">ثبت کلید</button>
  <div><label>رنگ زیرنویس</label><div class="opts" id="co"><button data-v="#ff8a1f" style="background:#ff8a1f"></button><button data-v="#ffffff" style="background:#fff"></button><button data-v="#ffd60a" style="background:#ffd60a"></button><button data-v="#3fa0ff" style="background:#3fa0ff"></button></div></div>
  <div><label>اندازه زیرنویس</label><div class="opts" id="sg"><button data-v=".035">کوچک</button><button data-v=".05">متوسط</button><button data-v=".07">بزرگ</button></div></div>
  <canvas id="sp" width="640" height="360" style="width:100%;max-width:360px;align-self:center;border-radius:12px;border:1px solid var(--l)"></canvas>
</div>

<div id="ed" hidden>
  <header><h1>ویرایش زیرنویس</h1><div class="sp"></div><button class="x" id="ec" aria-label="بستن">×</button></header>
  <div id="lx" class="cr" style="display:flex;flex-direction:column;gap:8px">
  <button class="btn" id="lau" style="flex:none">جستجوی خودکار آنلاین بر اساس متن زیرنویس</button>
  <button class="btn g" id="lwb" style="flex:none">جستجوی وب بدون API (آزمایشی)</button>
  <input id="lq" dir="rtl" placeholder="نام آهنگ و خواننده برای یافتن متن درست" style="direction:rtl;letter-spacing:0;text-align:right;width:100%">
  <div class="row"><button class="btn g" id="lsr" style="flex:1">جستجو با نام آهنگ</button><button class="btn g" id="lpb" style="flex:1">چسباندن متن</button></div>
  <textarea id="lta" rows="5" dir="auto" placeholder="متن درست را اینجا بچسبانید" hidden></textarea>
  <button class="btn" id="lgo" hidden style="flex:none">مقایسه با زیرنویس</button>
  <div id="lres" style="font-size:13px"></div>
</div>
  <div id="el"></div>
  <button class="btn" id="sv" style="flex:none">ثبت و بازگشت</button>
  <button class="btn g" id="ok" style="flex:none">تایید و دانلود</button>
</div>

  while(i>0||j>0){const t=T[i*W+j];if(i>0&&j>0&&t==0){if(lxS(cw[i-1].n,lw[j-1].n)>=.5)mt[j-1]=cw[i-1].ci;i--;j--}else if(i>0&&(j==0||t==1))i--;else j--}
  return mt}
function lxProp(mt,lw,nc){
  const out=Array.from({length:nc},()=>[]);let cur=-1,run=0;
  mt.forEach((ci,j)=>{if(ci>=0){cur=ci;run=0;out[ci].push(lw[j].w)}else if(cur>=0){run++;if(run<=3)out[cur].push(lw[j].w)}});
  return out.map(a=>a.join(' '))}
function lxCompare(txt){
  const R=$('#lres'),lw=lxW(txt.replace(/\[[^\]]*\]/g,' ')),cw=[];
  cues.forEach((c,ci)=>lxW(c.t).forEach(x=>cw.push({n:x.n,ci})));
  if(lw.length<5||cw.length<5){R.textContent='متن برای مقایسه کافی نیست.';return}
  lxChips(lxProp(lxAlign(cw,lw),lw,cues.length),'')}
function lxChips(pr,note){
  const R=$('#lres'),rows=$('#el').children;let n=0;
  pr.forEach((q,i)=>{const row=rows[i];if(!row)return;const o=row.querySelector('.lp');if(o)o.remove();
    if(!q||lxN(q)==lxN(cues[i].t))return;
    n++;const d=document.createElement('div');d.className='lp';d.style.cssText='margin-top:6px;padding:8px 10px;border:1px dashed #3b82f6;border-radius:10px;font-size:13px;color:#8ab4ff';d.dir='auto';d.textContent='پیشنهاد: '+q+'  (لمس برای جایگزینی)';
    d.onclick=()=>{cues[i].t=q;row.querySelector('textarea').value=q;d.remove()};row.appendChild(d)});
  R.innerHTML='';R.append(n?n+' پیشنهاد آماده است؛ زیر هر زیرنویس دیده می‌شود. ':'تفاوتی پیدا نشد. ');if(note){const d=document.createElement('div');d.style.cssText='margin-top:6px;color:#8ab4ff;word-break:break-all';d.textContent=note;R.appendChild(d)}
  if(n){const b=document.createElement('button');b.className='btn';b.style.cssText='flex:none;width:100%;margin-top:6px';b.textContent='پذیرفتن همه پیشنهادها';b.onclick=()=>{[...rows].forEach(r=>{const d=r.querySelector('.lp');if(d)d.click()});R.textContent='پیشنهادها اعمال شد.'};R.appendChild(b)}}
async function lxSearch(){
  const q=$('#lq').value.trim(),R=$('#lres');if(!q)return;R.textContent='در حال جستجو…';
  try{const r=await fx('https://lrclib.net/api/search?q='+encodeURIComponent(q),{},2e4);if(!r||!r.ok)throw 0;
    const l=((await r.json())||[]).filter(m=>m.plainLyrics||m.syncedLyrics).slice(0,8);
    if(!l.length){R.textContent='متنی پیدا نشد؛ متن را دستی بچسبانید.';return}
    R.innerHTML='';
    l.forEach(m=>{const b=document.createElement('button');b.className='btn g';b.style.cssText='flex:none;width:100%;margin-top:6px';b.textContent=(m.trackName||'')+' — '+(m.artistName||'');
      b.onclick=()=>{const tx=m.plainLyrics||(m.syncedLyrics||'').replace(/\[[^\]]*\]/g,'');$('#lta').hidden=false;$('#lgo').hidden=false;$('#lta').value=tx;lxCompare(tx)};R.appendChild(b)})}
  catch(e){R.textContent='دسترسی به منبع آنلاین ممکن نشد؛ متن را دستی بچسبانید.'}}
$('#lsr').onclick=lxSearch;
$('#lpb').onclick=()=>{$('#lta').hidden=false;$('#lgo').hidden=false};
$('#lgo').onclick=()=>lxCompare($('#lta').value);

async function lxAuto(){
  const R=$('#lres'),sel=cues.map((c,i)=>[i,c.t.replace(/[\r\n|]+/g,' ').trim()]).filter(x=>x[1]);
  if(sel.length<3){R.textContent='زیرنویس کافی نیست.';return}
  R.textContent='در حال جستجوی آنلاین… (ممکن است تا یک دقیقه طول بکشد)';
  const PS=`Below are machine-transcribed subtitle lines (numbered) from a recording; the transcription contains mistakes. Search the web (use Google Search) to identify the song, poem or speech and find its real, correct text, preferably from lyrics or transcript sites in the original language. Then return the corrected text for each line. Rules: keep the same numbering and exactly one output line per input line; only change a line when you found the real text in your search results, otherwise return it unchanged; never invent words; do not merge or split lines and do not move words between lines; write in the original language with correct spelling. Reply ONLY with lines in the format number|text. Last line: SRC|<title - artist, or unknown>.\n`;
  const PN=`Below are machine-transcribed subtitle lines (numbered) from a recording; the transcription contains mistakes. If you recognize the song, poem or speech and are highly confident of its exact original text, return the corrected text for each line. Rules: keep the same numbering and exactly one output line per input line; change a line only when you are highly confident of the real original words, otherwise return it unchanged; never guess or invent words; do not merge or split lines; keep the original language with correct spelling. Reply ONLY with lines in the format number|text. Last line: SRC|<title - artist, or unknown>.\n`;
  const pr=new Array(cues.length).fill(''),src=new Set();let name='',md='search';
  try{
    for(let o=0;o<sel.length;o+=120){
      const body=sel.slice(o,o+120).map(x=>(x[0]+1)+'|'+x[1]).join('\n');let tx='';
      if(md=='search'){try{tx=await ask([{text:PS+body}],[{google_search:{}}])}catch(e){if(!e.tool)throw e;md='nosearch'}}
      if(md=='nosearch')tx=await ask([{text:PN+body}]);
      tx.replace(/```/g,'').split('\n').forEach(l=>{const m=l.match(/^\s*(\d+)\s*\|\s*(.+)$/);if(m){const i=+m[1]-1;if(i>=0&&cues[i])pr[i]=m[2].trim()}else{const q=l.match(/^\s*SRC\s*\|\s*(.+)$/i);if(q&&!name)name=q[1].trim()}});
      if(md=='search')((LG&&LG.groundingChunks)||[]).forEach(c=>{if(c.web&&c.web.uri)src.add(c.web.title||c.web.uri)})}
  }catch(e){R.textContent='جستجوی آنلاین ناموفق بود: '+String(e.message||e).slice(0,120);return}
  if(!pr.some(Boolean)){R.textContent='متنی پیدا نشد؛ «جستجوی وب بدون API» یا «چسباندن متن» را امتحان کنید.';return}
  lxChips(pr,(md=='nosearch'?'جستجوی گوگل برای این کلید باز نیست؛ این پیشنهادها فقط از دانش مدل است و کم‌اعتمادتر است. ':'')+(name&&!/unknown/i.test(name)?'شناسایی‌شده: '+name+'  ':'')+(src.size?'منابع: '+[...src].slice(0,4).join('، '):''))}
async function lxWeb(){
  const R=$('#lres'),ls=[...new Set(cues.map(c=>c.t.replace(/[\r\n|]+/g,' ').trim()).filter(t=>t.split(/\s+/).length>=4))].sort((a,b)=>b.length-a.length).slice(0,2);
  if(!ls.length){R.textContent='زیرنویس کافی نیست.';return}
  const rd=async(u,ms)=>{const r=await fx('https://r.jina.ai/'+u,{},ms);return r&&r.ok?await r.text():''};
  const dec=u=>{const m=u.match(/[?&]u=a1([^&]+)/);if(m){try{return atob(m[1].replace(/-/g,'+').replace(/_/g,'/'))}catch(e){}}return u};
  R.textContent='در حال جستجوی وب…';
  const se=await rd('https://www.bing.com/search?q='+encodeURIComponent(ls.join(' ')+' متن آهنگ'),3e4);
  const us=[...new Set([...se.matchAll(/\]\((https?:\/\/[^)\s]+)\)/g)].map(m=>dec(m[1])).filter(u=>/^https?:/.test(u)&&!/bing\.com|microsoft\.com|google\.|youtube\.|youtu\.be|aparat\.com|instagram\.com|wikipedia/i.test(u)))].slice(0,4);
  if(!us.length){R.textContent='از جستجوی وب نتیجه‌ای نگرفتم (سرویس واسط یا موتور جستجو پاسخ نداد).';return}
  R.textContent='در حال بررسی '+us.length+' صفحه…';
  const cw=[];cues.forEach((c,ci)=>lxW(c.t).forEach(x=>cw.push({n:x.n,ci})));let best=null;
  for(const u of us){
    const tx=await rd(u,3e4);if(!tx)continue;
    const lw=lxW(tx.replace(/\(https?:[^)]*\)/g,' ').replace(/[\[\]]/g,' ')).slice(0,6000);
    if(lw.length<20)continue;
    await sleep(0);const mt=lxAlign(cw,lw),k=mt.filter(x=>x>=0).length;
    if(!best||k>best.k)best={u,lw,mt,k}}
  if(!best||best.k<cw.length*.35){R.textContent='متن مطابقی در صفحه‌های پیدا شده نبود؛ «چسباندن متن» را امتحان کنید.';return}
  lxChips(lxProp(best.mt,best.lw,cues.length),'منبع: '+best.u)}
$('#lau').onclick=lxAuto;
$('#lwb').onclick=lxWeb;
</script>
