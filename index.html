<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Subkon</title>
<style>
:root{--b:#2b7fff;--l:#16264a;--m:#8aa0c8;--t:#e8f0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;color:var(--t);font-family:Tahoma,Vazirmatn,system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px}
h1{margin:0;font-size:24px;color:var(--b);font-weight:800}
.st{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--l);color:var(--m);display:flex;align-items:center;gap:6px}
.st i{width:8px;height:8px;border-radius:50%;background:#556}
.st.ok{color:#5be08a;border-color:#2ecc71}.st.ok i{background:#2ecc71;box-shadow:0 0 8px #2ecc71}
.st.bad{color:#ff7b8a;border-color:#6b1f2a}.st.bad i{background:#ff3b4f;box-shadow:0 0 8px #ff3b4f}
.sp{flex:1}
.menu{width:44px;height:44px;border:0;background:none;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px}
.menu b{height:3px;border-radius:2px;background:var(--b)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px;overflow:auto}
#add{width:min(68vw,280px);aspect-ratio:1;border-radius:40px;border:2px dashed var(--b);background:radial-gradient(circle at 50% 40%,#0d2250,#02050d);color:var(--b);font-size:130px;font-weight:200;display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px #2b7fff2e;padding:0 0 12px}
#add:active{transform:scale(.97)}
#work{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;align-self:flex-start;margin:auto}
.vw{position:relative;background:#050a18;border:1px solid var(--l);border-radius:16px;overflow:hidden}
video{width:100%;max-height:42vh;display:block;background:#000}
#cue{position:absolute;inset:auto 8px 46px;text-align:center;font-size:15px;font-weight:700;text-shadow:0 0 4px #000,0 0 4px #000;pointer-events:none}
#nm{font-size:13px;color:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:14px;font:inherit;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--b),#0a4fd6)}
.btn.g{background:none;border:1px solid var(--b);color:var(--b)}
.btn:disabled,select:disabled{opacity:.35}
select,input{width:100%;border:1px solid var(--l);background:#050a18;color:var(--t);border-radius:12px;padding:13px;font:inherit;font-size:15px}
input{direction:ltr;letter-spacing:2px;text-align:left}
.bar{height:8px;background:#0b1630;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0a4fd6,#5cb3ff);transition:width .3s}
#msg{font-size:13px;color:var(--m);margin-top:6px;text-align:center}
.dl{display:flex;flex-direction:column;gap:10px;padding-top:6px;border-top:1px solid var(--l)}
#set{position:fixed;inset:0;background:#000;z-index:9;overflow:auto;padding:env(safe-area-inset-top) 16px 16px;display:flex;flex-direction:column;gap:14px}
#set header{padding:12px 0}
#set label{font-size:13px;color:var(--m);display:block;margin-bottom:6px}
#set>*{flex-shrink:0}
.opts{display:flex;gap:10px}.opts button{flex:1;height:46px;border-radius:12px;border:2px solid var(--l);background:#050a18;color:var(--t);font:inherit}.opts button.on{border-color:var(--b);background:#0d2250}#co button{border-radius:50%;flex:none;width:46px;border:3px solid #000}#co button.on{outline:3px solid var(--b)}
.x{border:0;background:none;color:var(--b);font-size:34px;width:44px;height:44px}
</style>
</head>
<body>
<header>
  <h1>Subkon</h1>
  <div class="st" id="st"><i></i><span id="stt">…</span></div>
  <div class="sp"></div>
  <button class="menu" id="mn" aria-label="تنظیمات"><b></b><b></b><b></b></button>
</header>

<main>
  <div style="width:min(100%,520px)"><label style="font-size:13px;color:var(--m);display:block;margin-bottom:6px">زبان زیرنویس خروجی</label><select id="lg"></select></div>
  <button id="add" aria-label="افزودن ویدئو">+</button>
  <input type="file" id="f" accept="video/*" hidden>
  <section id="work" hidden>
    <div class="vw"><video id="pv" controls playsinline></video><div id="cue"></div></div>
    <div id="nm"></div>
    <div class="row"><button class="btn" id="go">شروع زیرنویس</button><button class="btn g" id="chg">ویدئوی دیگر</button></div>
    <div id="pg" hidden><div class="bar"><i id="bar"></i></div><div id="msg"></div></div>
    <div class="dl">
      <button class="btn" id="ds" disabled>دانلود زیرنویس (SRT)</button>
      <select id="q">
        <option value="360">کیفیت ۳۶۰p</option>
        <option value="480">کیفیت ۴۸۰p</option>
        <option value="720" selected>کیفیت ۷۲۰p</option>
        <option value="1080">کیفیت ۱۰۸۰p</option>
        <option value="0">کیفیت اصلی</option>
      </select>
      <button class="btn g" id="dv" disabled>ساخت و دانلود ویدئوی زیرنویس‌دار</button>
    </div>
  </section>
</main>

<div id="set" hidden>
  <header><h1>تنظیمات</h1><div class="sp"></div><button class="x" id="cl" aria-label="بستن">×</button></header>
  <div><label>کلید API جمینای</label><input id="key" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <button class="btn" id="save" style="flex:none">ثبت کلید</button>
  <div><label>رنگ زیرنویس</label><div class="opts" id="co"><button data-v="#ff8a1f" style="background:#ff8a1f"></button><button data-v="#ffffff" style="background:#fff"></button><button data-v="#ffd60a" style="background:#ffd60a"></button><button data-v="#3fa0ff" style="background:#3fa0ff"></button></div></div>
  <div><label>اندازه زیرنویس</label><div class="opts" id="sg"><button data-v=".035">کوچک</button><button data-v=".05">متوسط</button><button data-v=".07">بزرگ</button></div></div>
  <canvas id="sp" width="640" height="360" style="width:100%;max-width:360px;align-self:center;border-radius:12px;border:1px solid var(--l)"></canvas>
</div>

<script>
const $=s=>document.querySelector(s),B='https://generativelanguage.googleapis.com',sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LANGS=[['fa','فارسی','Persian'],['en','انگلیسی','English'],['ar','عربی','Arabic'],['tr','ترکی استانبولی','Turkish'],['az','آذربایجانی','Azerbaijani'],['ku','کردی','Kurdish'],['ur','اردو','Urdu'],['hi','هندی','Hindi'],['bn','بنگالی','Bengali'],['fr','فرانسوی','French'],['de','آلمانی','German'],['es','اسپانیایی','Spanish'],['it','ایتالیایی','Italian'],['pt','پرتغالی','Portuguese'],['ru','روسی','Russian'],['uk','اوکراینی','Ukrainian'],['pl','لهستانی','Polish'],['nl','هلندی','Dutch'],['sv','سوئدی','Swedish'],['cs','چکی','Czech'],['ro','رومانیایی','Romanian'],['hu','مجاری','Hungarian'],['el','یونانی','Greek'],['he','عبری','Hebrew'],['zh','چینی','Chinese'],['ja','ژاپنی','Japanese'],['ko','کره‌ای','Korean'],['th','تایلندی','Thai'],['vi','ویتنامی','Vietnamese'],['id','اندونزیایی','Indonesian']];
let key='',real='',lang='fa',file=null,url='',cues=[],srt='',busy=false;
try{key=localStorage.getItem('sk')||'';lang=localStorage.getItem('sl')||'fa'}catch(e){}
real=key;
$('#lg').innerHTML=LANGS.map(l=>`<option value="${l[0]}">${l[1]}</option>`).join('');$('#lg').value=lang;
$('#lg').onchange=e=>{lang=e.target.value;try{localStorage.setItem('sl',lang)}catch(x){}};
let sc='#ffffff',sz='.05';
try{sc=localStorage.getItem('sc')||sc;sz=localStorage.getItem('sz')||sz}catch(e){}
function sty(){document.querySelectorAll('#co button,#sg button').forEach(b=>b.classList.toggle('on',b.dataset.v==(b.parentNode.id=='co'?sc:sz)));$('#cue').style.color=sc;$('#cue').style.fontSize=Math.round(sz*300)+'px';pvw()}
function pvw(){const x=$('#sp').getContext('2d'),v=$('#pv'),W=640,H=360,g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0a1a3a');g.addColorStop(1,'#1b4fb0');x.fillStyle=g;x.fillRect(0,0,W,H);
  if(file&&v.videoWidth){const r=Math.max(W/v.videoWidth,H/v.videoHeight),w=v.videoWidth*r,h=v.videoHeight*r;try{x.drawImage(v,(W-w)/2,(H-h)/2,w,h)}catch(e){}}
  cap(x,'نمونه زیرنویس',W,H,Math.round(H*sz),true)}
document.querySelectorAll('#co button,#sg button').forEach(b=>b.onclick=()=>{const c=b.parentNode.id=='co';if(c)sc=b.dataset.v;else sz=b.dataset.v;try{localStorage.setItem(c?'sc':'sz',c?sc:sz)}catch(e){}sty()});sty();
const ki=$('#key');
const mask=()=>{ki.value='*'.repeat(real.length)};mask();
ki.oninput=()=>{const v=ki.value;let i=0;while(i<v.length&&i<real.length&&v[i]=='*')i++;real=real.slice(0,i)+v.slice(i);mask()};
function status(c,t){$('#st').className='st '+c;$('#stt').textContent=t}
async function check(k){
  if(!k){status('bad','قطع');return false}
  status('','در حال بررسی…');
  try{const r=await fetch(B+'/v1beta/models?pageSize=1&key='+encodeURIComponent(k));
    if(r.ok){status('ok','متصل');return true}
    status('bad','قطع')}catch(e){status('bad','قطع')}
  return false}
check(key);
$('#save').onclick=async()=>{const k=real.trim();key=k;try{localStorage.setItem('sk',k)}catch(e){}if(await check(k))$('#set').hidden=true};
$('#mn').onclick=()=>{$('#set').hidden=false;pvw()};
$('#cl').onclick=()=>$('#set').hidden=true;

$('#add').onclick=()=>$('#f').click();
$('#chg').onclick=()=>{if(!busy)$('#f').click()};
$('#f').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!(f.type||'').startsWith('video/'))return;
  if(url)URL.revokeObjectURL(url);file=f;url=URL.createObjectURL(f);cues=[];srt='';
  $('#pv').src=url;$('#nm').textContent=f.name;$('#cue').textContent='';
  $('#add').hidden=true;$('#work').hidden=false;$('#pg').hidden=true;$('#dv').disabled=$('#ds').disabled=true};
$('#pv').ontimeupdate=e=>{const t=e.target.currentTime,q=cues.find(k=>t>=k.s&&t<k.e);$('#cue').textContent=q?q.t:''};

function prog(p,t){$('#pg').hidden=false;$('#bar').style.width=p+'%';$('#msg').textContent=t}
const MS=['gemini-2.5-flash','gemini-2.5-flash-lite','gemini-flash-latest'];let mi=0;
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
function wav(p){const w=new DataView(new ArrayBuffer(44+p.length*2)),s=(o,t)=>[...t].forEach((c,i)=>w.setUint8(o+i,c.charCodeAt(0)));
  s(0,'RIFF');w.setUint32(4,36+p.length*2,true);s(8,'WAVEfmt ');w.setUint32(16,16,true);w.setUint16(20,1,true);w.setUint16(22,1,true);w.setUint32(24,16000,true);w.setUint32(28,32000,true);w.setUint16(32,2,true);w.setUint16(34,16,true);s(36,'data');w.setUint32(40,p.length*2,true);
  new Int16Array(w.buffer,44).set(p);return new Blob([w],{type:'audio/wav'})}
function cuts(p){const C=Math.min(144e4,Math.max(48e4,Math.round(p.length/5))),W=48e3,F=800,a=[0];
  while(p.length-a[a.length-1]>C*1.3){const t=a[a.length-1]+C;let best=t,bv=1e18;
    for(let s=t-W;s<t+W;s+=F){let e=0;for(let i=s;i<s+F;i++)e+=Math.abs(p[i]);if(e<bv){bv=e;best=s}}
    a.push(best)}
  a.push(p.length);return a}
async function gen(blob,off){
  const n=LANGS.find(l=>l[0]==lang)[2],d=await b64(blob);
  const p=`Transcribe all speech in this audio and write subtitles in ${n} (translate when the spoken language differs). Sync every cue precisely with the speech: start exactly when the speaker begins the phrase and end when the phrase ends. Max two short lines per cue, 1-6 seconds each, chronological, no overlaps. Times are relative to the start of this audio. Reply ONLY with one cue per line and no other text, in this exact format: start|end|text  (start and end as m:ss.s, example: 0:12.5|0:15.2|Hello there)`;
  let err='';
  for(let i=mi;i<MS.length;i++){const m=MS[i];
    for(let t=0;t<3;t++){
      const r=await fetch(`${B}/v1beta/models/${m}:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{inline_data:{mime_type:'audio/wav',data:d}},{text:p}]}],generationConfig:{temperature:.2,...(m.startsWith('gemini-2.5')?{thinkingConfig:{thinkingBudget:0}}:{})}})});
      const j=await r.json();
      if(r.ok){const x=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('').replace(/```/g,'').split('\n');
        return x.map(l=>l.split('|')).filter(c=>c.length>2).map(c=>({s:tt(c[0])+off,e:tt(c[1])+off,t:c.slice(2).join('|').trim()}))}
      err=j.error?.message||r.status;
      if(r.status==429||r.status==503){await sleep(5000);continue}
      if(r.status==404){mi=Math.max(mi,i+1);break}
      throw new Error(err)}}
  throw new Error(err)}
const tt=s=>typeof s=='number'?s:String(s).trim().replace(',','.').split(':').map(Number).reduce((a,v)=>a*60+v,0);
const pad=(v,n=2)=>String(v).padStart(n,'0');
const ts=t=>pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(Math.floor(t%60))+','+pad(Math.floor(t%1*1000),3);

async function recAudio(){
  const v=document.createElement('video');v.src=url;v.preload='auto';
  await new Promise((r,j)=>{v.onloadedmetadata=r;v.onerror=()=>j(new Error('خواندن ویدئو ممکن نشد'))});
  const ac=new(window.AudioContext||window.webkitAudioContext)(),d=ac.createMediaStreamDestination();
  ac.createMediaElementSource(v).connect(d);ac.resume();
  const rec=new MediaRecorder(d.stream),ch=[];rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
  const fin=new Promise(r=>rec.onstop=r);v.onended=()=>rec.stop();
  const iv=setInterval(()=>prog(Math.round(v.currentTime/(v.duration||1)*9),'در حال استخراج صدا…'),500);
  rec.start();await v.play();await fin;clearInterval(iv);ac.close();
  return new Blob(ch,{type:rec.mimeType})}
async function getAudio(){
  const dec=ab=>new OfflineAudioContext(1,1,16000).decodeAudioData(ab);
  let buf;
  try{if(file.size>3e8)throw 0;buf=await dec(await file.arrayBuffer())}
  catch(e){buf=await dec(await (await recAudio()).arrayBuffer())}
  const n=buf.length,k=buf.numberOfChannels,sr=buf.sampleRate,o=Math.round(n*16000/sr),p=new Int16Array(o);
  const cd=[...Array(k)].map((_,i)=>buf.getChannelData(i));
  for(let i=0;i<o;i++){let a=0;const j=Math.min(n-1,Math.floor(i*sr/16000));for(const c of cd)a+=c[j];p[i]=Math.max(-1,Math.min(1,a/k))*32767}
  return p}
$('#go').onclick=async()=>{
  if(busy)return;
  if(!(await check(key))){$('#set').hidden=false;return}
  busy=true;$('#go').disabled=$('#chg').disabled=true;$('#dv').disabled=$('#ds').disabled=true;
  try{
    prog(3,'در حال استخراج صدا…');const P=await getAudio(),A=cuts(P),N=A.length-1,R=[];let ix=0,dn=0;
    prog(30,'در حال ساخت زیرنویس…');
    await Promise.all([0,1,2,3,4].map(async()=>{for(let k;(k=ix++)<N;){R[k]=await gen(wav(P.subarray(A[k],A[k+1])),A[k]/16000);prog(30+Math.round(++dn/N*68),'در حال ساخت زیرنویس… '+dn+'/'+N)}}));
    let a=R.flat().filter(c=>c.t&&isFinite(c.s)&&isFinite(c.e)).sort((x,y)=>x.s-y.s);
    a.forEach((c,i)=>{if(c.e<=c.s)c.e=c.s+2;const n=a[i+1];if(n&&n.s<c.e)c.e=Math.max(c.s+.3,n.s)});
    if(!a.length)throw new Error('گفتاری پیدا نشد');
    cues=a;srt=a.map((c,i)=>`${i+1}\n${ts(c.s)} --> ${ts(c.e)}\n${c.t}\n`).join('\n');
    prog(100,'زیرنویس آماده شد');$('#dv').disabled=$('#ds').disabled=false;
  }catch(e){prog(0,'خطا: '+(e.message||e).toString().slice(0,160))}
  busy=false;$('#go').disabled=$('#chg').disabled=false};

const base=()=>(file.name.replace(/\.[^.]+$/,'')||'video')+'-sub';
function save(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),6e4)}
$('#ds').onclick=()=>save(new Blob(['\ufeff'+srt],{type:'text/plain;charset=utf-8'}),base()+'.srt');

function cap(x,t,w,h,fs,rtl){
  x.font=`bold ${fs}px Tahoma,sans-serif`;x.direction=rtl?'rtl':'ltr';x.textAlign='center';x.textBaseline='bottom';
  const ln=[];let cur='';
  for(const wd of t.replace(/\s*\n\s*/g,' ').split(' ')){const tr=cur?cur+' '+wd:wd;if(x.measureText(tr).width>w*.9&&cur){ln.push(cur);cur=wd}else cur=tr}
  ln.push(cur);const lh=fs*1.4;let y=h*.94;
  ln.reverse().forEach(s=>{const tw=x.measureText(s).width;x.fillStyle='rgba(0,0,0,.65)';x.fillRect(w/2-tw/2-8,y-lh+3,tw+16,lh);x.fillStyle=sc;x.fillText(s,w/2,y-4);y-=lh})}

$('#dv').onclick=async()=>{
  if(busy||!cues.length)return;busy=true;
  $('#go').disabled=$('#chg').disabled=$('#dv').disabled=$('#ds').disabled=true;
  $('#pv').pause();
  const ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume();
  try{
    const v=document.createElement('video');v.src=url;v.playsInline=true;v.preload='auto';
    await new Promise((r,j)=>{v.onloadedmetadata=r;v.onerror=()=>j(new Error('خواندن ویدئو ممکن نشد'))});
    const h=Math.round(Math.min(+$('#q').value||v.videoHeight,v.videoHeight)/2)*2,w=Math.round(v.videoWidth*h/v.videoHeight/2)*2;
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    const d=ac.createMediaStreamDestination();ac.createMediaElementSource(v).connect(d);
    const st=c.captureStream(30);d.stream.getAudioTracks().forEach(t=>st.addTrack(t));
    const mt=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
    const rec=new MediaRecorder(st,{mimeType:mt,videoBitsPerSecond:Math.min(12e6,Math.max(5e5,w*h*3))});
    const ch=[],rtl=['fa','ar','ur','he'].includes(lang),fs=Math.max(12,Math.round(h*sz));let on=true;
    rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
    const fin=new Promise(r=>rec.onstop=r);
    v.onended=()=>setTimeout(()=>rec.stop(),400);
    const draw=()=>{if(!on)return;x.drawImage(v,0,0,w,h);const t=v.currentTime,q=cues.find(k=>t>=k.s&&t<k.e);if(q)cap(x,q.t,w,h,fs,rtl);
      const p=Math.min(99,Math.round(t/(v.duration||1)*100));prog(p,'در حال ساخت ویدئو… '+p+'٪');requestAnimationFrame(draw)};
    rec.start(1000);await v.play();draw();await fin;on=false;
    save(new Blob(ch,{type:mt.split(';')[0]}),base()+(mt.includes('mp4')?'.mp4':'.webm'));
    prog(100,'ویدئو آماده و ذخیره شد');
  }catch(e){prog(0,'خطا: '+(e.message||e).toString().slice(0,160))}
  try{ac.close()}catch(e){}
  busy=false;$('#go').disabled=$('#chg').disabled=$('#dv').disabled=$('#ds').disabled=false};
</script>
</body>
</html>
